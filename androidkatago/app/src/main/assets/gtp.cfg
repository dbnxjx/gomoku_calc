basicRule = RENJU
VCNRule = NOVC
firstPassWin = false
numSearchThreads = 8
numEigenThreadsPerModel = 4
# OpenCL uses this setting for the number of independent neural-net workers.
# Two workers can overlap GPU execution and host readback on Android devices
# with enough memory; reduce to 1 if a vendor driver is unstable.
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 8
openclUseFP16 = false
nnCacheSizePowerOfTwo = 14
nnMutexPoolSizePowerOfTwo = 8
maxVisits = 32
maxTime = 30.0
ponderingEnabled = false
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = true
startupPrintMessageToStderr = true
