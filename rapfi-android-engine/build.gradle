// Top-level build file. The native engine lives in engine/CMakeLists.txt and
// is built automatically as part of the app module.
//
// Version compatibility (verified against official AGP / Kotlin tables):
//   Gradle 9.0  +  AGP 8.13.0  +  Kotlin 2.3.0
// AGP 8.2.x still called Project.exec(Action), which Gradle 9.0 removed.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.0' apply false
}
